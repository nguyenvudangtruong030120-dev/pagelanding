            const [searchQuery, setSearchQuery] = useState("");

            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

            useEffect(() => {
                const calculateTimeLeft = () => {
                    const now = new Date();
                    const targetDate = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
                    const difference = targetDate.getTime() - now.getTime();
                    if (difference <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0 };
                    return {
                        days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                        minutes: Math.floor((difference / 1000 / 60) % 60),
                        seconds: Math.floor((difference / 1000) % 60),
                    };
                };
                setTimeLeft(calculateTimeLeft());
                const timer = setInterval(() => setTimeLeft(calculateTimeLeft()), 1000);
                return () => clearInterval(timer);
            }, []);

                                            <div className="space-y-1">
                                                <div className="text-brand-cyan font-bold text-sm">Nhấn để duyệt ảnh</div>
                                                <p className="text-[10px] text-brand-muted">Hỗ trợ JPG, PNG, WebP tối đa 5MB</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="pt-4 flex justify-end gap-3 items-center">
                                    <button type="button" onClick={() => onNavigate("home")} className="text-brand-muted hover:text-white font-semibold transition-all text-sm px-4">Hủy bỏ</button>
                                    <button type="submit" className="bg-brand-cyan text-brand-bg px-8 py-3.5 rounded-full font-sans font-bold hover:bg-white duration-300">Gửi tác phẩm</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {isSubmitting && !successStory && (
                        <div className="glass-panel rounded-3xl p-8 sm:p-16 text-center space-y-6">
                            <div className="relative w-16 h-16 mx-auto flex items-center justify-center">
                                <div className="absolute inset-0 border-4 border-brand-cyan/20 rounded-full"></div>
                                <div className="absolute inset-0 border-4 border-t-brand-cyan rounded-full animate-spin"></div>
                            </div>
                            <h3 className="text-xl sm:text-2xl text-white font-bold">Hệ thống đang lưu trữ và phân tích...</h3>
                            <p className="text-sm text-brand-cyan font-mono animate-pulse">{loadingSteps[loadingStep]}</p>
                            
                            <div className="bg-black/40 border border-white/5 p-4 rounded-xl text-left text-xs font-mono text-brand-muted space-y-1 mt-6">
                                <p className="text-green-400">&gt; Connecting secure submission pipelines...</p>
                                <p>&gt; Word count validation: {wordCount} words detected...</p>
                                <p>&gt; Checking AI Natural Language assessment coefficients...</p>
                            </div>
                        </div>
                    )}

                    {successStory && (
                        <div className="glass-panel rounded-3xl p-6 sm:p-10 text-center space-y-6">
                            <div className="w-12 h-12 rounded-full bg-green-500/15 text-green-400 border border-green-500/30 flex items-center justify-center mx-auto">✔</div>
                            <div>
                                <h3 className="text-2xl sm:text-3xl font-display font-medium text-white">Nộp bài dự thi thành công!</h3>
                                <p className="text-brand-muted text-xs sm:text-sm mt-1 max-w-sm mx-auto">Câu chuyện của bạn đã được kiểm duyệt và hiển thị tại Thư viện câu chuyện chung của cuộc thi.</p>
                            </div>

                            {successStory.aiReview && (
                                <div className="bg-brand-cyan/5 border border-brand-cyan/25 rounded-2xl p-6 text-left space-y-3">
                                    <div className="flex justify-between items-center pb-2 border-b border-white/5">
                                        <div className="flex items-center gap-1.5 text-white font-bold text-sm">
                                            ✨ Đánh giá sơ bộ AI Ban Giám Khảo
                                        </div>
                                        <span className="text-xs text-brand-cyan font-bold">Chỉ số cảm nhận: {successStory.aiReview.emotionalScore}/100</span>
                                    </div>
                                    <p className="text-xs sm:text-sm text-brand-cyan italic">"{successStory.aiReview.summary}"</p>
                                    <div className="space-y-1.5">
                                        <h5 className="text-[10px] text-white uppercase font-black">Khuyến nghị bổ sung:</h5>
                                        <ul className="text-xs text-brand-muted space-y-1 list-disc list-inside">
                                            {successStory.aiReview.suggestions.map((s, idx) => <li key={idx}>{s}</li>)}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            <div className="flex flex-col sm:flex-row gap-3 justify-center pt-4">
                                <button onClick={() => { setSuccessStory(null); setIsSubmitting(false); }} className="px-5 py-2.5 rounded-full bg-white/5 border border-white/10 text-white font-semibold hover:bg-white/10 transition-all">Nộp thêm bài viết khác</button>
                                <button onClick={() => onNavigate("home")} className="px-8 py-2.5 rounded-full bg-brand-cyan text-brand-bg font-bold hover:bg-white transition-all">Quay lại Thư viện</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Main App Wrapper
        const App = () => {
            const [activeTab, setActiveTab] = useState("rules");
            const [stories, setStories] = useState([]);
            const [likedStories, setLikedStories] = useState([]);
            const [viewingStory, setViewingStory] = useState(null);

            useEffect(() => {
                try {
                    const local = localStorage.getItem("lotus_standalone_stories");
                    if (local) {
                        setStories(JSON.parse(local));
                    } else {
                        setStories(DEFAULT_STORIES_DATA);
                        localStorage.setItem("lotus_standalone_stories", JSON.stringify(DEFAULT_STORIES_DATA));
                    }

                    const likes = localStorage.getItem("lotus_standalone_likes");
                    if (likes) setLikedStories(JSON.parse(likes));
                } catch (e) {
                    setStories(DEFAULT_STORIES_DATA);
                }
            }, []);

            const handleLike = (storyId) => {
                let currentLikes = [...likedStories];
                const alreadyLiked = currentLikes.includes(storyId);
                
                if (alreadyLiked) {
                    currentLikes = currentLikes.filter(id => id !== storyId);
                } else {
                    currentLikes.push(storyId);
                }

                setLikedStories(currentLikes);
                localStorage.setItem("lotus_standalone_likes", JSON.stringify(currentLikes));

                const updatedStories = stories.map(story => {
                    if (story.id === storyId) {
                        return { ...story, likesCount: alreadyLiked ? story.likesCount - 1 : story.likesCount + 1 };
                    }
                    return story;
                });
                setStories(updatedStories);
                localStorage.setItem("lotus_standalone_stories", JSON.stringify(updatedStories));
            };

            const handleNewSubmission = (newStory) => {
                const updated = [newStory, ...stories];
                setStories(updated);
                localStorage.setItem("lotus_standalone_stories", JSON.stringify(updated));
            };

            return (
                <div className="min-h-screen flex flex-col justify-between text-[#e1e2eb] relative">
                    
                    {/* Immersive liquid glass orbs background */}
                    <div className="fixed inset-0 -z-10 bg-[#030607] overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-b from-[#030607]/40 via-[#051112]/50 to-[#030607]/75 backdrop-blur-[2px]" />
                        <div className="absolute top-[10%] right-[10%] w-[350px] h-[350px] bg-brand-cyan/10 rounded-full blur-[100px] animate-liquid-one" />
                        <div className="absolute bottom-[10%] left-[-5%] w-[400px] h-[400px] bg-brand-cyan/5 rounded-full blur-[110px] animate-liquid-two" />
                        <div className="absolute inset-0 bg-grid-pattern opacity-30 mix-blend-overlay" />
                    </div>

                    {/* NavigationHeader */}
                    <nav className="sticky top-0 w-full z-50 bg-white/[0.03] backdrop-blur-xl border-b border-white/10 py-4 px-6 sm:px-12 flex items-center justify-between">
                        <div onClick={() => setActiveTab("home")} className="cursor-pointer">
                            <LotusLogo size="sm" />
                        </div>
                        <div className="hidden md:flex gap-8 text-sm font-semibold select-none text-brand-muted">
                            <button onClick={() => setActiveTab("home")} className={`hover:text-white transition-colors pb-1 ${activeTab === "home" ? 'text-brand-cyan font-bold border-b-2 border-brand-cyan' : ''}`}>Trang chủ</button>
                            <button onClick={() => setActiveTab("rules")} className={`hover:text-white transition-colors pb-1 ${activeTab === "rules" ? 'text-brand-cyan font-bold border-b-2 border-brand-cyan' : ''}`}>Thể lệ & Giải thưởng</button>
                            <button onClick={() => setActiveTab("submit")} className={`hover:text-white transition-colors pb-1 ${activeTab === "submit" ? 'text-brand-cyan font-bold border-b-2 border-brand-cyan' : ''}`}>Nộp bài</button>
                        </div>
                        <button onClick={() => setActiveTab("home")} className="bg-brand-cyan text-brand-bg px-5 py-2 rounded-full font-serif font-black tracking-wider text-xs hover:bg-white transition-all shadow-[0_4px_12px_rgba(0,251,251,0.2)]">
                            BACK TO WEBSITE
                        </button>
                    </nav>

                    {/* Mobile Navigation bar */}
                    <div className="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#070d0e]/90 backdrop-blur-2xl border border-white/10 shadow-[0_0_20px_rgba(0,251,251,0.15)] rounded-full px-6 py-3 flex gap-8 z-40">
                        <button onClick={() => setActiveTab("home")} className={`p-1.5 transition-all ${activeTab === "home" ? 'text-brand-cyan' : 'text-brand-muted'}`}><Icons.Home className="w-5 h-5" /></button>
                        <button onClick={() => setActiveTab("rules")} className={`p-1.5 transition-all ${activeTab === "rules" ? 'text-brand-cyan' : 'text-brand-muted'}`}><Icons.Award className="w-5 h-5" /></button>
                        <button onClick={() => setActiveTab("submit")} className={`p-1.5 transition-all ${activeTab === "submit" ? 'text-brand-cyan' : 'text-brand-muted'}`}><Icons.Edit3 className="w-5 h-5" /></button>
                    </div>

                    {/* Main Content Render */}
                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-8 py-10 pb-28 relative z-10">
                        {activeTab === "home" && <Home stories={stories} onLike={handleLike} likedStories={likedStories} onNavigate={setActiveTab} setViewingStory={setViewingStory} />}
                        {activeTab === "rules" && <RulesAndPrizes onNavigate={setActiveTab} />}
                        {activeTab === "submit" && <SubmitEntry onSubmitSuccess={handleNewSubmission} onNavigate={setActiveTab} />}
                    </main>

                    {/* Story Detail Modal */}
                    {viewingStory && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto" onClick={() => setViewingStory(null)}>
                            <div className="bg-[#0b1012] border border-white/10 rounded-3xl max-w-3xl w-full my-8 overflow-hidden relative" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setViewingStory(null)} className="absolute top-4 right-4 z-10 w-8 h-8 rounded-full bg-black/60 text-white flex items-center justify-center hover:bg-white hover:text-brand-bg transition-all">✕</button>
                                <div className="h-56 sm:h-72 w-full relative bg-white/5">
                                    <img src={viewingStory.image} className="w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-[#0b1012] via-transparent to-transparent"></div>
                                    <div className="absolute bottom-6 left-6 right-6">
                                        <span className="bg-brand-cyan/20 border border-brand-cyan/40 text-brand-cyan text-xs font-semibold px-2.5 py-0.5 rounded">{viewingStory.category}</span>
                                        <h3 className="text-xl sm:text-3xl font-bold text-white mt-1.5">{viewingStory.title}</h3>
                                    </div>
                                </div>
                                <div className="p-6 sm:p-8 space-y-6 text-left">
                                    <div className="flex justify-between items-center text-xs text-brand-muted pb-4 border-b border-white/5">
                                        <div>Tác giả: <strong className="text-white">{viewingStory.fullName}</strong></div>
                                        <button onClick={() => handleLike(viewingStory.id)} className={`flex items-center gap-1.5 px-3 py-1 rounded-xl ${likedStories.includes(viewingStory.id) ? 'text-red-400 bg-red-500/15' : 'text-brand-muted'}`}>
                                            <Icons.Heart className="w-4 h-4" fill={likedStories.includes(viewingStory.id) ? "currentColor" : "none"} />
                                            <span>Thích ({viewingStory.likesCount})</span>
                                        </button>
                                    </div>
                                    <p className="text-sm sm:text-base text-white/90 font-sans leading-relaxed whitespace-pre-wrap">{viewingStory.content}</p>

                                    {viewingStory.aiReview && (
                                        <div className="bg-brand-cyan/5 border border-brand-cyan/20 rounded-2xl p-5 text-left space-y-3">
                                            <h4 className="text-white font-bold text-sm">✨ Đánh giá AI Ban Biên Tập</h4>
                                            <p className="text-xs sm:text-sm text-brand-cyan italic">"{viewingStory.aiReview.summary}"</p>
                                            <div className="space-y-1">
                                                <h5 className="text-[10px] text-white uppercase font-black">Khuyến nghị hoàn thiện:</h5>
                                                <ul className="text-xs text-brand-muted space-y-1 list-disc list-inside">
                                                    {viewingStory.aiReview.suggestions.map((s, idx) => <li key={idx}>{s}</li>)}
                                                </ul>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="px-6 py-4 border-t border-white/5 flex justify-end bg-brand-surface/20">
                                    <button onClick={() => setViewingStory(null)} className="bg-white/5 border border-white/10 hover:bg-white/10 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all">Đóng nội dung</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer wrapper */}
                    <footer className="w-full bg-[#0a0f10] border-t border-white/5 py-12 px-6 sm:px-12 flex flex-col sm:flex-row justify-between items-center gap-6 mt-auto">
                        <LotusLogo size="sm" />
                        <p className="text-[11px] text-brand-muted font-sans font-normal text-center sm:text-left leading-normal">
                            © 2026 LOTUS CONSULTING. All rights reserved. Registered Migration Agents Australia.
                        </p>
                    </footer>
                </div>
            );
        };

        // Render main engine
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
